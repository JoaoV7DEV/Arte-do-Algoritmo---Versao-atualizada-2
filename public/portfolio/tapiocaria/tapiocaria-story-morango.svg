<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="100%" height="100%">
  <defs>
    <linearGradient id="bgStory" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A0D15"/>
      <stop offset="35%" stop-color="#281121"/>
      <stop offset="70%" stop-color="#1B0C17"/>
      <stop offset="100%" stop-color="#10060E"/>
    </linearGradient>
    <linearGradient id="berryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF2A7A"/>
      <stop offset="100%" stop-color="#D61858"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00FFFF"/>
      <stop offset="100%" stop-color="#00B8D9"/>
    </linearGradient>
    <linearGradient id="chocolateGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5E3017"/>
      <stop offset="100%" stop-color="#34180A"/>
    </linearGradient>
    <linearGradient id="storyStickerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E71870"/>
      <stop offset="50%" stop-color="#C754F0"/>
      <stop offset="100%" stop-color="#00FFFF"/>
    </linearGradient>
    <filter id="glowStory" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="shadowStory" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000000" flood-opacity="0.75"/>
    </filter>
  </defs>

  <!-- Background Canvas (4:5 Ratio) -->
  <rect width="800" height="1000" fill="url(#bgStory)"/>

  <!-- Ambient Glow Spots -->
  <circle cx="200" cy="300" r="300" fill="#E71870" opacity="0.16" filter="url(#glowStory)"/>
  <circle cx="650" cy="260" r="260" fill="#C754F0" opacity="0.14" filter="url(#glowStory)"/>
  <circle cx="400" cy="850" r="240" fill="#00FFFF" opacity="0.10" filter="url(#glowStory)"/>

  <!-- Instagram Story Progress Bars -->
  <g transform="translate(40, 22)">
    <rect x="0" y="0" width="232" height="4" rx="2" fill="#FFFFFF" fill-opacity="0.95"/>
    <rect x="244" y="0" width="232" height="4" rx="2" fill="#FFFFFF" fill-opacity="0.4"/>
    <rect x="488" y="0" width="232" height="4" rx="2" fill="#FFFFFF" fill-opacity="0.4"/>
  </g>

  <!-- Instagram Story Header -->
  <g transform="translate(40, 42)">
    <!-- Avatar -->
    <circle cx="30" cy="30" r="24" fill="url(#berryGrad)"/>
    <text x="30" y="37" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="900" text-anchor="middle" fill="#FFFFFF">DM</text>
    
    <!-- User Handles -->
    <text x="68" y="25" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF">tapiocariadonamoca</text>
    <text x="68" y="46" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="500" fill="#DDB2D4">Patrocinado • Meta Ads Stories</text>
    
    <!-- Format Badge -->
    <rect x="560" y="14" width="160" height="34" rx="17" fill="#E71870" fill-opacity="0.25" stroke="#E71870" stroke-width="1.5"/>
    <text x="640" y="36" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="800" text-anchor="middle" fill="#FFA1D2">STORIES AD</text>
  </g>

  <!-- Story Hook & Catchphrase (Top Area) -->
  <g transform="translate(44, 130)">
    <rect width="210" height="36" rx="18" fill="#E71870" fill-opacity="0.95"/>
    <text x="105" y="23" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="800" text-anchor="middle" fill="#FFFFFF">🍓 SOBREMESA DO DIA</text>
    
    <text x="0" y="74" font-family="system-ui, -apple-system, sans-serif" font-size="34" font-weight="900" fill="#FFFFFF" letter-spacing="-0.5">
      Impossível resistir.
    </text>
    <text x="0" y="106" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="600" fill="#FF8EC3">
      Nutella de verdade com morango fresco.
    </text>
  </g>

  <!-- Food Illustration / Composition (Artisanal Plate in Center) -->
  <g filter="url(#shadowStory)">
    <rect x="40" y="260" width="720" height="490" rx="32" fill="#180D18" stroke="#421C38" stroke-width="2"/>
    
    <!-- Plate base glow -->
    <ellipse cx="400" cy="520" rx="300" ry="170" fill="#0A040A" opacity="0.8"/>

    <!-- Folded Tapioca Body -->
    <path d="M 150,560 C 160,410 280,360 480,370 C 630,380 670,480 650,580 C 530,620 310,620 150,560 Z" fill="#FDFBF7" filter="url(#shadowStory)"/>
    
    <!-- Chocolate / Nutella Drizzle lines -->
    <path d="M 210,490 Q 310,440 410,480 T 600,455" stroke="url(#chocolateGrad)" stroke-width="20" stroke-linecap="round" fill="none"/>
    <path d="M 240,550 Q 350,490 440,530 T 590,515" stroke="url(#chocolateGrad)" stroke-width="15" stroke-linecap="round" fill="none"/>
    <path d="M 290,585 Q 400,540 480,570 T 570,560" stroke="url(#chocolateGrad)" stroke-width="11" stroke-linecap="round" fill="none"/>

    <!-- Fresh Strawberries (Morangos fatiados) -->
    <!-- Strawberry 1 -->
    <g transform="translate(250, 460) rotate(-15)">
      <path d="M 0,0 C 22,-22 55,0 50,40 C 44,68 17,80 0,68 C -17,80 -44,68 -50,40 C -55,0 -22,-22 0,0 Z" fill="#FF1E60"/>
      <ellipse cx="-9" cy="22" rx="2.5" ry="4.5" fill="#FFE27A" opacity="0.85"/>
      <ellipse cx="11" cy="34" rx="2.5" ry="4.5" fill="#FFE27A" opacity="0.85"/>
      <ellipse cx="-2" cy="50" rx="2.5" ry="4.5" fill="#FFE27A" opacity="0.85"/>
      <!-- Green crown -->
      <path d="M -16,-2 Q 0,-16 0,0 Q 0,-16 16,-2 Q 0,4 0,0 Z" fill="#2ECC71"/>
    </g>

    <!-- Strawberry 2 -->
    <g transform="translate(400, 440) rotate(18)">
      <path d="M 0,0 C 22,-22 55,0 50,40 C 44,68 17,80 0,68 C -17,80 -44,68 -50,40 C -55,0 -22,-22 0,0 Z" fill="#E60046"/>
      <ellipse cx="-9" cy="22" rx="2.5" ry="4.5" fill="#FFE27A" opacity="0.85"/>
      <ellipse cx="13" cy="36" rx="2.5" ry="4.5" fill="#FFE27A" opacity="0.85"/>
      <!-- Green crown -->
      <path d="M -16,-2 Q 0,-16 0,0 Q 0,-16 16,-2 Q 0,4 0,0 Z" fill="#27AE60"/>
    </g>

    <!-- Strawberry 3 (cut slice) -->
    <g transform="translate(530, 480) rotate(-25)">
      <ellipse cx="0" cy="0" rx="32" ry="40" fill="#FF2E70"/>
      <ellipse cx="0" cy="0" rx="20" ry="28" fill="#FFA5C0"/>
      <path d="M 0,-18 L 0,18 M -12,0 L 12,0" stroke="#FFD1DF" stroke-width="2.5"/>
    </g>

    <!-- Price Tag Badge in composition -->
    <g transform="translate(500, 280)">
      <rect width="220" height="42" rx="21" fill="#1A0D15" stroke="#E71870" stroke-width="2"/>
      <text x="110" y="27" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="900" text-anchor="middle" fill="#FF8EC3">NUTELLA + MORANGO</text>
    </g>
  </g>

  <!-- Interactive Story Link Sticker (Bottom Area) -->
  <g transform="translate(140, 780)" filter="url(#shadowStory)">
    <!-- Sticker background -->
    <rect width="520" height="74" rx="37" fill="#FFFFFF" stroke="#00FFFF" stroke-width="2.5"/>
    <!-- Link Icon -->
    <circle cx="50" cy="37" r="24" fill="#E71870"/>
    <path d="M 42,37 C 42,33 46,29 50,29 L 52,29 M 48,45 L 50,45 C 54,45 58,41 58,37" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" fill="none"/>
    <!-- Sticker Call to Action -->
    <text x="280" y="45" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="900" text-anchor="middle" fill="#140612">
      PEDIR PELO WHATSAPP ➔
    </text>
  </g>

  <text x="400" y="890" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="500" text-anchor="middle" fill="#D6BACF">
    Entrega rápida em Salvador • Peça quentinha
  </text>

  <!-- Swipe Up Indicator -->
  <g transform="translate(400, 940)">
    <path d="M -12,8 L 0,-4 L 12,8" stroke="#00FFFF" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <text x="0" y="32" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#FFFFFF">
      Deslize para ver o cardápio
    </text>
  </g>
</svg>
